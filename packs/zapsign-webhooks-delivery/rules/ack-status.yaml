schemaVersion: 1
id: WL-ZAPSIGN-WEBHOOK-ACK-001
kind: cel
scope: envelope
severity: error
stability: preview
title: ZapSign webhook acknowledgement must be HTTP 200
explanation: ZapSign requires the receiving application to return HTTP 200; other statuses cause webhook retries and can generate duplicate deliveries.
docsRef: webhooks
remediationKey: zapsign-webhook-ack-status
requires: has(envelope.response)
assert: envelope.response.status == 200
evidencePointers:
  - /response/status
messages:
  evidence-unavailable: "No response status was captured, so ZapSign webhook acknowledgement cannot be decided."
