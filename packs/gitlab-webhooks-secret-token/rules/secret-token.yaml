schemaVersion: 1
id: WL-GITLAB-LEGACY-TOKEN-001
kind: secret-match
scope: envelope
severity: error
stability: preview
title: GitLab legacy webhook secret token must match
explanation: GitLab still sends a configured legacy secret token as plain text in X-Gitlab-Token for backward compatibility, while recommending signing tokens for new webhooks.
secretMatchRef: legacy-secret-token
docsRef: webhooks
remediationKey: gitlab-legacy-webhook-secret-token
messages:
  secret-match-valid: "X-Gitlab-Token matches the configured legacy GitLab webhook secret token."
  secret-unavailable: "Set GITLAB_WEBHOOK_SECRET_TOKEN to verify the legacy X-Gitlab-Token header."
  missing-secret-input: "X-Gitlab-Token is missing from a complete capture of the legacy secret-token contract."
  ambiguous-secret-input: "Multiple X-Gitlab-Token values were observed where exactly one legacy token is expected."
  secret-mismatch: "X-Gitlab-Token does not match the configured GitLab legacy webhook secret token."
  insufficient-header-evidence: "The header capture is incomplete, so absence of X-Gitlab-Token cannot be proven."
