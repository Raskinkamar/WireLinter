packProtocol: "1.3"
id: gitlab-webhooks-secret-token
name: GitLab Legacy Secret-Token Webhooks
packVersion: 0.1.0
providerDocsRevision: "2026-08-17"
minWireLinterVersion: 0.1.0
capabilities:
  - passive-lint
secrets:
  secret-token:
    env: GITLAB_WEBHOOK_SECRET_TOKEN
    required: false
    description: Legacy GitLab webhook secret token configured alongside or instead of a signing token
docs:
  webhooks:
    url: https://docs.gitlab.com/user/project/integrations/webhooks/
    revision: "2026-08-17"
    section: Backward compatibility
secretMatches:
  legacy-secret-token: secret-matches/legacy-secret-token.yaml
rules:
  - rules/secret-token.yaml
metadata:
  status: preview
  maintainer: wirelint
  surface: legacy-x-gitlab-token
  recommendation: Prefer the gitlab-webhooks signing-token contract for new webhooks; this pack exists for backward compatibility and migrations
