schemaVersion: 1
id: WL-ZENVIA-V2-CONTENT-TYPE-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Zenvia v2 webhook callback payload must be JSON
explanation: Zenvia's webhook callback schemas are delivered using application/json.
docsRef: api
requires: >-
  envelope.request.headersCompleteness == "complete" ||
  envelope.request.headers.exists(h, h.name.lowerAscii() == "content-type")
assert: >-
  envelope.request.headers.exists(
    h,
    h.name.lowerAscii() == "content-type" &&
    h.value.lowerAscii().startsWith("application/json")
  )
evidencePointers:
  - /request/headers
messages:
  evidence-unavailable: "Content-Type was not observed, but the Zenvia webhook header capture is incomplete."
