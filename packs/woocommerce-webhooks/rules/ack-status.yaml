schemaVersion: 1
id: WL-WOO-ACK-STATUS-001
kind: cel
scope: envelope
severity: error
stability: preview
title: WooCommerce webhook acknowledgement must be 2xx
explanation: WooCommerce treats non-2xx responses as failed deliveries and disables a webhook after five consecutive failures.
docsRef: webhooks
remediationKey: woocommerce-webhook-ack-status
requires: has(envelope.response)
assert: envelope.response.status >= 200 && envelope.response.status < 300
evidencePointers:
  - /response/status
messages:
  evidence-unavailable: "No response was captured, so WooCommerce acknowledgement status cannot be decided."
