schemaVersion: 1
id: WL-ZOOM-ACK-STATUS-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Zoom webhook acknowledgement must be HTTP 200 or 204
explanation: Zoom's current API guidance asks event receivers to respond with HTTP 200 or 204 to confirm receipt.
docsRef: api-reference
remediationKey: zoom-webhook-ack-status
requires: has(envelope.response)
assert: envelope.response.status == 200 || envelope.response.status == 204
evidencePointers:
  - /response/status
messages:
  evidence-unavailable: "No response was captured, so Zoom acknowledgement status cannot be decided."
