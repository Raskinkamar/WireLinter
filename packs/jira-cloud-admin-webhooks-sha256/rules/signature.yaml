schemaVersion: 1
id: WL-JIRA-ADMIN-SIGNATURE-001
kind: signature
scope: envelope
severity: error
stability: preview
title: Jira Cloud secure admin webhook SHA-256 signature must be valid
explanation: Jira Cloud secure admin webhooks currently support X-Hub-Signature with sha256 HMAC over the raw payload using the configured secret.
signatureRef: current-sha256
docsRef: secure-admin
remediationKey: jira-cloud-admin-webhook-signature
messages:
  missing-signature: "X-Hub-Signature is missing from a complete capture of a secure admin webhook."
  malformed-signature: "This contract expects the currently documented sha256=<hex digest> X-Hub-Signature form."
  signature-mismatch: "The Jira Cloud admin webhook signature does not match HMAC-SHA256 of the exact raw payload for the supplied secret."
  secret-unavailable: "Set JIRA_WEBHOOK_SECRET to verify secure admin webhook authenticity."
  insufficient-body-fidelity: "Jira signs the webhook payload, so reconstructed or unavailable bytes cannot prove the signature."
  insufficient-header-evidence: "The header capture is incomplete, so X-Hub-Signature cannot be proven absent."
