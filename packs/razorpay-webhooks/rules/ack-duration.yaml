schemaVersion: 1
id: WL-RAZORPAY-ACK-DURATION-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Razorpay webhook acknowledgement must complete within 5 seconds
explanation: Razorpay treats a webhook as timed out when the endpoint does not respond within 5 seconds.
docsRef: delivery
remediationKey: razorpay-webhook-ack-duration
requires: has(envelope.response)
assert: double(envelope.response.durationMs) < 5000.0
evidencePointers:
  - /response/durationMs
messages:
  evidence-unavailable: "No response timing was captured, so Razorpay's five-second timeout cannot be decided."
