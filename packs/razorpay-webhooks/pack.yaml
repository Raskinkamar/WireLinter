packProtocol: "1.2"
id: razorpay-webhooks
name: Razorpay Webhooks
packVersion: 0.1.0
providerDocsRevision: "2026-08-18"
minWireLinterVersion: 0.1.0
capabilities:
  - passive-lint
secrets:
  webhook-secret:
    env: RAZORPAY_WEBHOOK_SECRET
    required: false
    description: Secret configured for the Razorpay webhook
docs:
  verification:
    url: https://razorpay.com/docs/webhooks/validate-test/
    revision: "2026-08-18"
    section: Validate Webhooks
  delivery:
    url: https://razorpay.com/docs/webhooks/best-practices/
    revision: "2026-08-18"
    section: Best Practices
signatures:
  payload-hmac-sha256: signatures/payload-hmac-sha256.yaml
rules:
  - rules/signature.yaml
  - rules/method.yaml
  - rules/ack-status.yaml
  - rules/ack-duration.yaml
metadata:
  status: preview
  maintainer: wirelint
  vendor: razorpay
  surface: signed-webhook
