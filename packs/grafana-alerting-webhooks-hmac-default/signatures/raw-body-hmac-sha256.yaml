schemaVersion: 1
id: raw-body-hmac-sha256
sourceRefs:
  - notifier
secret:
  ref: hmac-secret
  representation: utf8
bindings:
  signature-candidates:
    fromHeader:
      name: X-Grafana-Alerting-Signature
      cardinality: exactly-one
      trimSpace: true
  body:
    fromRawBody:
      requireFidelity: exact
message:
  - binding: body
candidates:
  binding: signature-candidates
  encoding: hex
mac:
  algorithm: hmac-sha256
