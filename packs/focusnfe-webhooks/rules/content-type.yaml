schemaVersion: 1
id: WL-FOCUSNFE-CONTENT-TYPE-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Focus NFe webhook payload must be JSON
explanation: Focus NFe documents webhook event data as JSON sent via POST.
docsRef: webhooks
requires: >-
  envelope.request.headersCompleteness == "complete" ||
  envelope.request.headers.exists(h, h.name.lowerAscii() == "content-type")
assert: >-
  envelope.request.headers.exists(
    h,
    h.name.lowerAscii() == "content-type" &&
    h.value.lowerAscii().startsWith("application/json")
  )
evidencePointers:
  - /request/headers
messages:
  evidence-unavailable: "Content-Type was not observed, but the Focus NFe request header capture is incomplete."
