schemaVersion: 1
id: WL-BLIP-ANALYTICS-CONTENT-TYPE-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Blip analytics webhook payload must be JSON
explanation: Blip requires the analytics webhook service to receive JSON objects in the request body.
docsRef: webhooks
requires: >-
  envelope.request.headersCompleteness == "complete" ||
  envelope.request.headers.exists(h, h.name.lowerAscii() == "content-type")
assert: >-
  envelope.request.headers.exists(
    h,
    h.name.lowerAscii() == "content-type" &&
    h.value.lowerAscii().startsWith("application/json")
  )
evidencePointers:
  - /request/headers
messages:
  evidence-unavailable: "Content-Type was not observed, but the Blip webhook header capture is incomplete."
