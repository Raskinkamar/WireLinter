schemaVersion: 1
id: WL-BITBUCKET-EVENT-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Bitbucket Cloud event key must be present
explanation: Bitbucket Cloud event payload requests include X-Event-Key identifying the event that triggered the webhook.
docsRef: event-payloads
remediationKey: bitbucket-cloud-event-key
requires: >-
  envelope.request.headersCompleteness == "complete" ||
  envelope.request.headers.exists(h, h.name.lowerAscii() == "x-event-key" && h.value != "")
assert: >-
  envelope.request.headers.exists(h, h.name.lowerAscii() == "x-event-key" && h.value != "")
evidencePointers:
  - /request/headers
messages:
  evidence-unavailable: "X-Event-Key was not observed, but the header capture is incomplete."
