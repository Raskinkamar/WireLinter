schemaVersion: 1
id: WL-VTEX-ORDER-HOOK-DURATION-001
kind: cel
scope: envelope
severity: error
stability: preview
title: VTEX Order Hook acknowledgement must complete within 5 seconds
explanation: VTEX requires the Order Hook endpoint to return HTTP 200 within 5000 milliseconds.
docsRef: hook
remediationKey: vtex-order-hook-ack-duration
requires: has(envelope.response)
assert: double(envelope.response.durationMs) < 5000.0
evidencePointers:
  - /response/durationMs
messages:
  evidence-unavailable: "No response timing was captured, so VTEX's five-second Order Hook deadline cannot be decided."
