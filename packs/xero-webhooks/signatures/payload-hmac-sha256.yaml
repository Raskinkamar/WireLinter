schemaVersion: 1
id: payload-hmac-sha256
sourceRefs:
  - webhooks
secret:
  ref: webhook-key
  representation: utf8
bindings:
  signature-candidates:
    fromHeader:
      name: x-xero-signature
      cardinality: exactly-one
      trimSpace: true
  body:
    fromRawBody:
      requireFidelity: exact
message:
  - binding: body
candidates:
  binding: signature-candidates
  encoding: base64-standard
mac:
  algorithm: hmac-sha256
