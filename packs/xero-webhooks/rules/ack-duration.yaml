schemaVersion: 1
id: WL-XERO-ACK-DURATION-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Xero webhook acknowledgement must complete within 5 seconds
explanation: Xero requires the receiving endpoint to respond within 5 seconds.
docsRef: webhooks
remediationKey: xero-webhook-ack-duration
requires: has(envelope.response)
assert: double(envelope.response.durationMs) < 5000.0
evidencePointers:
  - /response/durationMs
messages:
  evidence-unavailable: "No response timing was captured, so the Xero five-second requirement cannot be decided."
