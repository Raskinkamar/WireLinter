schemaVersion: 1
id: WL-XERO-ACK-STATUS-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Xero webhook acknowledgement must be 2xx
explanation: Xero expects correctly signed webhook payloads to receive a 2xx response.
docsRef: webhooks
remediationKey: xero-webhook-ack-status
requires: has(envelope.response)
assert: envelope.response.status >= 200 && envelope.response.status < 300
evidencePointers:
  - /response/status
messages:
  evidence-unavailable: "No response was captured, so Xero acknowledgement status cannot be decided."
