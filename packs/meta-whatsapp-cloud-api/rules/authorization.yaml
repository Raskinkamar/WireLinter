schemaVersion: 1
id: WL-META-WA-CLOUD-AUTH-001
kind: cel
scope: envelope
severity: error
stability: preview
title: WhatsApp Cloud API calls must use Bearer authorization
explanation: Meta Graph API accepts the access token through the Authorization Bearer header; WireLinter retains the scheme while redacting the token.
docsRef: messages
requires: envelope.request.headersCompleteness == "complete" || envelope.request.headers.exists(h, h.name.lowerAscii() == "authorization")
assert: envelope.request.headers.exists(h, h.name.lowerAscii() == "authorization" && h.value.lowerAscii().startsWith("bearer "))
evidencePointers: [/request/headers]
messages:
  evidence-unavailable: "Authorization was not observed in the incomplete header capture."
