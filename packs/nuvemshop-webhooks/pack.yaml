name: Nuvemshop Webhooks
packVersion: 0.1.0
providerDocsRevision: "2026-08-18"
minWireLinterVersion: 0.1.0
capabilities:
  - passive-lint
secrets:
  app-secret:
    env: NUVEMSHOP_APP_SECRET
    required: false
    description: Secret do aplicativo Nuvemshop
