schemaVersion: 1
id: timestamp-body-hmac-sha256
sourceRefs:
  - verification
secret:
  ref: signing-secret
  representation: utf8
bindings:
  signature-candidates:
    fromHeader:
      name: X-Zendesk-Webhook-Signature
      cardinality: exactly-one
      trimSpace: true
  timestamp:
    fromHeader:
      name: X-Zendesk-Webhook-Signature-Timestamp
      cardinality: exactly-one
      trimSpace: true
  body:
    fromRawBody:
      requireFidelity: exact
message:
  - binding: timestamp
  - binding: body
candidates:
  binding: signature-candidates
  encoding: base64-standard
mac:
  algorithm: hmac-sha256
