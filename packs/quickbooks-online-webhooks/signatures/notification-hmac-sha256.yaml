schemaVersion: 1
id: notification-hmac-sha256
sourceRefs:
  - configuration
secret:
  ref: verifier-token
  representation: utf8
bindings:
  signature-candidates:
    fromHeader:
      name: intuit-signature
      cardinality: exactly-one
      trimSpace: true
  body:
    fromRawBody:
      requireFidelity: exact
message:
  - binding: body
candidates:
  binding: signature-candidates
  encoding: base64-standard
mac:
  algorithm: hmac-sha256
