schemaVersion: 1
id: WL-VINDI-SERVICE-QUERY-SECRET-001
kind: secret-match
scope: envelope
severity: error
stability: preview
title: Vindi Service webhook query secret must match
explanation: Vindi documents a secret query parameter as one supported way to authenticate webhook calls and recommends validating the configured value on receipt.
secretMatchRef: query-secret
docsRef: security
remediationKey: vindi-service-webhook-query-secret
messages:
  secret-match-valid: "The secret query value matches the configured Vindi Service webhook secret."
  secret-unavailable: "Set VINDI_WEBHOOK_QUERY_SECRET to verify the configured secret query parameter."
  missing-secret-input: "The secret query parameter is missing from an exact Vindi Service webhook capture."
  ambiguous-secret-input: "Multiple secret query values were observed; the verification value must be unambiguous."
  secret-mismatch: "The secret query value does not match the configured Vindi Service webhook secret."
  insufficient-query-evidence: "The query capture is not exact, so the Vindi Service secret cannot be verified safely."
