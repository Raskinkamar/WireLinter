schemaVersion: 1
id: WL-GADMIN-REPORTS-STATE-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Google Admin Reports resource state must be present
explanation: Reports push notifications include X-Goog-Resource-State with sync or an event name.
docsRef: push
remediationKey: google-admin-reports-resource-state
requires: envelope.request.headersCompleteness == "complete" || envelope.request.headers.exists(h, h.name.lowerAscii() == "x-goog-resource-state" && h.value != "")
assert: envelope.request.headers.exists(h, h.name.lowerAscii() == "x-goog-resource-state" && h.value != "")
evidencePointers:
  - /request/headers
messages:
