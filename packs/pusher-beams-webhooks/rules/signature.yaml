schemaVersion: 1
id: WL-PUSHER-BEAMS-SIGNATURE-001
kind: signature
scope: envelope
severity: error
stability: preview
title: Pusher Beams webhook signature must be valid
explanation: Pusher Beams signs the exact request body with HMAC-SHA1 using the webhook secret and sends a hexadecimal digest in Webhook-Signature.
signatureRef: payload-hmac-sha1
docsRef: webhooks
remediationKey: pusher-beams-webhook-signature
messages:
  missing-signature: "Webhook-Signature is missing from a complete Pusher Beams webhook capture."
  malformed-signature: "Webhook-Signature is malformed; Pusher Beams uses a hexadecimal HMAC-SHA1 digest."
  signature-mismatch: "Webhook-Signature does not match HMAC-SHA1 of the exact raw request body for the supplied webhook secret."
  secret-unavailable: "Set PUSHER_BEAMS_WEBHOOK_SECRET to verify authenticity."
  insufficient-body-fidelity: "Pusher Beams signs the request body, so reconstructed or unavailable body bytes cannot prove authenticity."
  insufficient-header-evidence: "The captured header set is incomplete, so Webhook-Signature cannot be proven absent."
