schemaVersion: 1
id: WL-PUSHER-BEAMS-EVENT-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Pusher Beams webhook event type must be present
explanation: Pusher Beams includes Webhook-Event-Type identifying the event that triggered the request.
docsRef: webhooks
remediationKey: pusher-beams-event-header
requires: >-
  envelope.request.headersCompleteness == "complete" ||
  envelope.request.headers.exists(h, h.name.lowerAscii() == "webhook-event-type" && h.value != "")
assert: >-
  envelope.request.headers.exists(h, h.name.lowerAscii() == "webhook-event-type" && h.value != "")
evidencePointers:
  - /request/headers
messages:
  evidence-unavailable: "Webhook-Event-Type was not observed, but the request header capture is incomplete."
