kind: cel
scope: envelope
severity: error
stability: preview
title: Pusher Beams webhook acknowledgement must be 2xx
explanation: Pusher Beams expects a 2xx response from the receiver.
docsRef: webhooks
remediationKey: pusher-beams-ack-status
requires: has(envelope.response)
assert: envelope.response.status >= 200 && envelope.response.status < 300
evidencePointers:
  - /response/status
messages:
