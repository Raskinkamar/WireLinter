    revision: "2026-08-18"
    section: Criar webhook por marketplace
secretMatches:
  authorization: secret-matches/authorization.yaml
rules:
  - rules/authorization.yaml
  - rules/method.yaml
  - rules/content-type.yaml
metadata:
