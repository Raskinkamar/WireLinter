schemaVersion: 1
id: WL-SUPABASE-AUTH-HOOK-DURATION-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Supabase Auth HTTP Hook response must complete within 5 seconds
explanation: Supabase Auth HTTP Hooks have a five-second execution window before timing out.
docsRef: auth-hooks
remediationKey: supabase-auth-hook-duration
requires: has(envelope.response)
assert: double(envelope.response.durationMs) < 5000.0
evidencePointers:
  - /response/durationMs
messages:
  evidence-unavailable: "No response timing was captured, so Supabase Auth's five-second HTTP Hook timeout cannot be decided."
