schemaVersion: 1
id: notification-hmac-sha1
sourceRefs:
  - webhook-models
secret:
  ref: client-secret
  representation: utf8
bindings:
  signature-candidates:
    fromHeader:
      name: X-Hub-Signature
      cardinality: exactly-one
      trimSpace: true
  body:
    fromRawBody:
      requireFidelity: exact
message:
  - binding: body
candidates:
  binding: signature-candidates
  encoding: hex
  stripPrefix: "sha1="
mac:
  algorithm: hmac-sha1
