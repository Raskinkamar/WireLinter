schemaVersion: 1
id: raw-body-hmac-sha256
sourceRefs:
  - verification
secret:
  ref: channel-secret
  representation: utf8
bindings:
  signature-candidates:
    fromHeader:
      name: x-line-signature
      cardinality: exactly-one
      trimSpace: true
  body:
    fromRawBody:
      requireFidelity: exact
message:
  - binding: body
candidates:
  binding: signature-candidates
  encoding: base64-standard
mac:
  algorithm: hmac-sha256
