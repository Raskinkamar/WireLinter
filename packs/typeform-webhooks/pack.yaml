packProtocol: "1.2"
id: typeform-webhooks
name: Typeform Signed Webhooks
packVersion: 0.1.0
providerDocsRevision: "2026-08-17"
minWireLinterVersion: 0.1.0
capabilities:
  - passive-lint
secrets:
  webhook-secret:
    env: TYPEFORM_WEBHOOK_SECRET
    required: false
    description: Secret configured on the Typeform webhook
docs:
  security:
    url: https://www.typeform.com/developers/webhooks/secure-your-webhooks/
    revision: "2026-08-17"
    section: Validate payload from Typeform
  delivery:
    url: https://www.typeform.com/developers/pr_1748/webhooks/
    revision: "2026-08-17"
    section: Key concepts
signatures:
  payload-hmac-sha256: signatures/payload-hmac-sha256.yaml
rules:
  - rules/signature.yaml
  - rules/method.yaml
  - rules/ack-status.yaml
  - rules/ack-duration.yaml
metadata:
  status: preview
  maintainer: wirelint
  surface: signed-webhook
