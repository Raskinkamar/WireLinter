schemaVersion: 1
id: WL-LD-ACK-STATUS-001
kind: cel
scope: envelope
severity: error
stability: preview
title: LaunchDarkly webhook acknowledgement must be 2xx
explanation: LaunchDarkly retries a webhook once after a non-2xx response.
docsRef: webhooks
remediationKey: launchdarkly-webhook-ack-status
requires: has(envelope.response)
assert: envelope.response.status >= 200 && envelope.response.status < 300
evidencePointers:
  - /response/status
messages:
  evidence-unavailable: "No response was captured, so LaunchDarkly acknowledgement status cannot be decided."
