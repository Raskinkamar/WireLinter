packProtocol: "1.2"
id: nfeio-webhooks
name: NFE.io Signed Webhooks
packVersion: 0.1.0
providerDocsRevision: "2026-08-18"
minWireLinterVersion: 0.1.0
capabilities:
  - passive-lint
secrets:
  webhook-secret:
    env: NFEIO_WEBHOOK_SECRET
    required: false
    description: Secret de 32 a 64 caracteres configurado no webhook NFE.io
docs:
  verification:
    url: https://nfe.io/docs/desenvolvedores/bibliotecas/nodejs/webhooks/
    revision: "2026-08-18"
    section: Verificar a assinatura
  registration:
    url: https://nfe.io/docs/desenvolvedores/rest-api/nota-fiscal-de-produto-v2/criar-um-webhook/
    revision: "2026-08-18"
    section: Criar um Webhook
signatures:
  payload-hmac-sha1: signatures/payload-hmac-sha1.yaml
rules:
  - rules/signature.yaml
  - rules/method.yaml
metadata:
  status: preview
  maintainer: wirelint
  vendor: nfeio
  region: BR
  surface: fiscal-webhook-signed
  signaturePolicyNote: "Current NFE.io documentation explicitly states X-Hub-Signature with HMAC-SHA1 over exact raw bytes; older material mentioning X-NFe-Signature, SHA-256 or Base64 is documented as incorrect for this surface."
