schemaVersion: 1
id: WL-PADDLE-ACK-DURATION-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Paddle webhook acknowledgement must complete within 5 seconds
explanation: Paddle retries when the endpoint does not respond within five seconds.
docsRef: delivery
remediationKey: paddle-webhook-ack-duration
requires: has(envelope.response)
assert: double(envelope.response.durationMs) < 5000.0
evidencePointers:
  - /response/durationMs
messages:
  evidence-unavailable: "No response timing was captured, so Paddle's five-second delivery deadline cannot be decided."
