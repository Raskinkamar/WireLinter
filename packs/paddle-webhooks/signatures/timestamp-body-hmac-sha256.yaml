schemaVersion: 1
id: timestamp-body-hmac-sha256
sourceRefs:
  - signature
secret:
  ref: endpoint-secret
  representation: utf8
parsers:
  signature-fields:
    sourceHeader:
      name: Paddle-Signature
      cardinality: exactly-one
      trimSpace: true
    format:
      type: delimited-pairs
      itemDelimiter: ";"
      pairDelimiter: "="
      trimSpace: true
bindings:
  timestamp:
    fromField:
      parser: signature-fields
      key: ts
      cardinality: exactly-one
  signature-candidates:
    fromField:
      parser: signature-fields
      key: h1
      cardinality: one-or-more
  body:
    fromRawBody:
      requireFidelity: exact
message:
  - binding: timestamp
    suffix: ":"
  - binding: body
candidates:
  binding: signature-candidates
  encoding: hex
mac:
  algorithm: hmac-sha256
