schemaVersion: 1
id: WL-CLICKSIGN-ACK-DURATION-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Clicksign webhook acknowledgement must complete within 5 seconds
explanation: Clicksign documents a five-second webhook timeout before the delivery is queued for retry.
docsRef: delivery
remediationKey: clicksign-webhook-ack-duration
requires: has(envelope.response)
assert: double(envelope.response.durationMs) < 5000.0
evidencePointers:
  - /response/durationMs
messages:
  evidence-unavailable: "No response timing was captured, so Clicksign's five-second timeout cannot be decided."
