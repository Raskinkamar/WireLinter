schemaVersion: 1
id: WL-GDRIVE-ACK-STATUS-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Google Drive push acknowledgement must use a documented success status
explanation: Google Drive documents HTTP 200, 201, 202, 204, or 102 as successful notification acknowledgements.
docsRef: push
remediationKey: google-drive-push-ack-status
requires: has(envelope.response)
assert: envelope.response.status == 200 || envelope.response.status == 201 || envelope.response.status == 202 || envelope.response.status == 204 || envelope.response.status == 102
evidencePointers:
  - /response/status
messages:
  evidence-unavailable: "No response was captured, so Google Drive acknowledgement status cannot be decided."
