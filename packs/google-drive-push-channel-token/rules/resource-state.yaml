schemaVersion: 1
id: WL-GDRIVE-RESOURCE-STATE-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Google Drive resource state must be present
explanation: Drive push notifications include X-Goog-Resource-State describing the resource/channel state.
docsRef: push
remediationKey: google-drive-resource-state
requires: envelope.request.headersCompleteness == "complete" || envelope.request.headers.exists(h, h.name.lowerAscii() == "x-goog-resource-state" && h.value != "")
assert: envelope.request.headers.exists(h, h.name.lowerAscii() == "x-goog-resource-state" && h.value != "")
evidencePointers:
  - /request/headers
messages:
  evidence-unavailable: "X-Goog-Resource-State was not observed, but the header capture is incomplete."
