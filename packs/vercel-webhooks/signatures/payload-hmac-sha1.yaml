schemaVersion: 1
id: payload-hmac-sha1
sourceRefs:
  - webhook-api
secret:
  ref: webhook-secret
  representation: utf8
bindings:
  signature-candidates:
    fromHeader:
      name: x-vercel-signature
      cardinality: exactly-one
      trimSpace: true
  body:
    fromRawBody:
      requireFidelity: exact
message:
  - binding: body
candidates:
  binding: signature-candidates
  encoding: hex
mac:
  algorithm: hmac-sha1
