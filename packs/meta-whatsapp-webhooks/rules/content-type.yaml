schemaVersion: 1
id: WL-META-WA-WEBHOOK-CONTENT-TYPE-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Meta WhatsApp webhook payload must be JSON
explanation: Meta webhook deliveries use a JSON request body.
docsRef: webhooks
requires: envelope.request.headersCompleteness == "complete" || envelope.request.headers.exists(h, h.name.lowerAscii() == "content-type")
assert: envelope.request.headers.exists(h, h.name.lowerAscii() == "content-type" && h.value.lowerAscii().startsWith("application/json"))
evidencePointers: [/request/headers]
messages:
  evidence-unavailable: "Content-Type was not observed in the incomplete header capture."
