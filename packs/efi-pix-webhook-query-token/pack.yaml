packProtocol: "1.3"
id: efi-pix-webhook-query-token
name: Efí Pix Webhook Query Verification Token
packVersion: 0.1.0
providerDocsRevision: "2026-08-18"
minWireLinterVersion: 0.1.0
capabilities:
  - passive-lint
secrets:
  verification-token:
    env: EFI_PIX_WEBHOOK_QUERY_TOKEN
    required: false
    description: Valor próprio cadastrado no parâmetro hmac da URL do webhook Efí Pix
docs:
  webhooks:
    url: https://dev.efipay.com.br/docs/api-pix/webhooks/
    revision: "2026-08-18"
    section: Camada adicional de segurança - Utilizando HMAC na URL do webhook
secretMatches:
  query-token: secret-matches/query-token.yaml
rules:
  - rules/query-token.yaml
  - rules/method.yaml
metadata:
  status: preview
  maintainer: wirelint
  vendor: efi
  region: BR
  surface: pix-webhook-query-verification
  mtlsRequired: true
  scopeNote: "Efí requires mTLS for Pix webhook transport. WireLinter validates the documented query-token layer here; the HTTP Trace does not prove the TLS client-certificate handshake itself."
