schemaVersion: 1
id: WL-GADMIN-DIR-MESSAGE-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Google Admin Directory message number must be present
explanation: Directory push notifications include X-Goog-Message-Number identifying the message within the channel.
docsRef: push
remediationKey: google-admin-directory-message-number
requires: envelope.request.headersCompleteness == "complete" || envelope.request.headers.exists(h, h.name.lowerAscii() == "x-goog-message-number" && h.value != "")
assert: envelope.request.headers.exists(h, h.name.lowerAscii() == "x-goog-message-number" && h.value != "")
evidencePointers:
  - /request/headers
messages:
  evidence-unavailable: "X-Goog-Message-Number was not observed, but the header capture is incomplete."
