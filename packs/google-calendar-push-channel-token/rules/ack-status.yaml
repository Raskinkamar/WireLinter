schemaVersion: 1
id: WL-GCAL-ACK-STATUS-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Google Calendar push acknowledgement must use a documented success status
explanation: Google Calendar documents HTTP 200, 201, 202, 204, or 102 as successful notification acknowledgements.
docsRef: push
remediationKey: google-calendar-push-ack-status
requires: has(envelope.response)
assert: envelope.response.status == 200 || envelope.response.status == 201 || envelope.response.status == 202 || envelope.response.status == 204 || envelope.response.status == 102
evidencePointers:
  - /response/status
messages:
  evidence-unavailable: "No response was captured, so Google Calendar acknowledgement status cannot be decided."
