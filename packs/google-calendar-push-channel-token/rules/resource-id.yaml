schemaVersion: 1
id: WL-GCAL-RESOURCE-ID-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Google Calendar resource identifier must be present
explanation: Calendar push notifications include X-Goog-Resource-ID identifying the watched resource.
docsRef: push
remediationKey: google-calendar-resource-id
requires: envelope.request.headersCompleteness == "complete" || envelope.request.headers.exists(h, h.name.lowerAscii() == "x-goog-resource-id" && h.value != "")
assert: envelope.request.headers.exists(h, h.name.lowerAscii() == "x-goog-resource-id" && h.value != "")
evidencePointers:
  - /request/headers
messages:
  evidence-unavailable: "X-Goog-Resource-ID was not observed, but the header capture is incomplete."
