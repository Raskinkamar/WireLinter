schemaVersion: 1
id: WL-GCAL-CHANNEL-ID-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Google Calendar channel identifier must be present
explanation: Calendar push notifications always include X-Goog-Channel-ID identifying the notification channel.
docsRef: push
remediationKey: google-calendar-channel-id
requires: envelope.request.headersCompleteness == "complete" || envelope.request.headers.exists(h, h.name.lowerAscii() == "x-goog-channel-id" && h.value != "")
assert: envelope.request.headers.exists(h, h.name.lowerAscii() == "x-goog-channel-id" && h.value != "")
evidencePointers:
  - /request/headers
messages:
  evidence-unavailable: "X-Goog-Channel-ID was not observed, but the header capture is incomplete."
