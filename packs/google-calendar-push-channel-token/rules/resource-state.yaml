schemaVersion: 1
id: WL-GCAL-RESOURCE-STATE-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Google Calendar resource state must be present
explanation: Calendar push notifications include X-Goog-Resource-State such as sync, exists, or not_exists.
docsRef: push
remediationKey: google-calendar-resource-state
requires: envelope.request.headersCompleteness == "complete" || envelope.request.headers.exists(h, h.name.lowerAscii() == "x-goog-resource-state" && h.value != "")
assert: envelope.request.headers.exists(h, h.name.lowerAscii() == "x-goog-resource-state" && h.value != "")
evidencePointers:
  - /request/headers
messages:
  evidence-unavailable: "X-Goog-Resource-State was not observed, but the header capture is incomplete."
