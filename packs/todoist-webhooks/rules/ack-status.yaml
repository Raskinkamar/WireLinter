schemaVersion: 1
id: WL-TODOIST-ACK-STATUS-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Todoist webhook acknowledgement must be HTTP 200
explanation: Todoist considers responses other than HTTP 200 failed and retries the notification.
docsRef: webhooks
remediationKey: todoist-webhook-ack-status
requires: has(envelope.response)
assert: envelope.response.status == 200
evidencePointers:
  - /response/status
messages:
  evidence-unavailable: "No response was captured, so the Todoist HTTP 200 acknowledgement cannot be decided."
