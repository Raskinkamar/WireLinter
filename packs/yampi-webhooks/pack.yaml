packProtocol: "1.2"
id: yampi-webhooks
name: Yampi Webhooks
packVersion: 0.1.0
providerDocsRevision: "2026-08-18"
minWireLinterVersion: 0.1.0
capabilities:
  - passive-lint
secrets:
  webhook-secret:
    env: YAMPI_WEBHOOK_SECRET
    required: false
    description: Secret key returned when the Yampi webhook is created
docs:
  webhooks:
    url: https://docs.yampi.com.br/api-reference/introduction-webhook
    revision: "2026-08-18"
