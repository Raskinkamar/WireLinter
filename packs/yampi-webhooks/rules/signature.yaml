schemaVersion: 1
id: WL-YAMPI-SIGNATURE-001
kind: signature
scope: envelope
severity: error
stability: preview
title: Yampi webhook signature must match
explanation: Yampi signs the webhook request body with HMAC-SHA256 and sends the Base64 result in X-Yampi-Hmac-SHA256.
signatureRef: payload-hmac-sha256
docsRef: webhooks
remediationKey: yampi-webhook-signature
messages:
  signature-valid: "X-Yampi-Hmac-SHA256 matches the webhook body and configured secret."
  secret-unavailable: "Set YAMPI_WEBHOOK_SECRET to verify Yampi webhook authenticity."
  missing-signature: "X-Yampi-Hmac-SHA256 is missing from a complete header capture."
  ambiguous-signature-input: "Multiple X-Yampi-Hmac-SHA256 values were observed; the signature must be unambiguous."
  malformed-signature: "X-Yampi-Hmac-SHA256 is not valid Base64 HMAC-SHA256 data."
  signature-mismatch: "X-Yampi-Hmac-SHA256 does not match the webhook body and configured secret."
  insufficient-body-fidelity: "The request body was not captured exactly, so Yampi authenticity cannot be proven."
  insufficient-header-evidence: "The header capture is incomplete, so the Yampi signature cannot be proven absent."
