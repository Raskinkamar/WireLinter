schemaVersion: 1
id: WL-YAMPI-ACK-STATUS-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Yampi webhook receiver must return 2xx
explanation: Yampi requires a 2xx response or marks the delivery as failed.
docsRef: webhooks
requires: envelope.response != null
assert: envelope.response.status >= 200 && envelope.response.status < 300
evidencePointers:
  - /response/status
messages:
  evidence-unavailable: "No receiver response was captured, so Yampi acknowledgement status cannot be checked."
