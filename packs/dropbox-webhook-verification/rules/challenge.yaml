schemaVersion: 1
id: WL-DROPBOX-VERIFY-CHALLENGE-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Dropbox verification request must contain exactly one challenge query parameter
explanation: Dropbox includes a random challenge query parameter in the initial webhook verification request.
docsRef: webhooks
remediationKey: dropbox-webhook-verification-challenge
requires: envelope.request.queryFidelity == "exact"
assert: envelope.request.query.filter(q, q.name == "challenge").size() == 1 && envelope.request.query.exists(q, q.name == "challenge" && q.value != "")
evidencePointers:
  - /request/query
  - /request/queryFidelity
messages:
  evidence-unavailable: "Exact decoded query evidence was not captured, so the Dropbox challenge cannot be decided safely."
