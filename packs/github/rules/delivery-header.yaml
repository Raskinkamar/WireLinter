schemaVersion: 1
id: WL-GH-DELIVERY-001
kind: cel
scope: envelope
severity: error
stability: preview
title: GitHub delivery identifier must be present
explanation: GitHub sends X-GitHub-Delivery as the globally unique identifier for the webhook delivery; a complete capture without it is inconsistent with a GitHub webhook delivery.
docsRef: webhook-delivery-docs
remediationKey: github-delivery-header
requires: >-
  envelope.request.headersCompleteness == "complete" ||
  envelope.request.headers.exists(
    h,
    h.name.lowerAscii() == "x-github-delivery" && h.value != ""
  )
assert: >-
  envelope.request.headers.exists(
    h,
    h.name.lowerAscii() == "x-github-delivery" && h.value != ""
  )
evidencePointers:
  - /request/headers
messages:
  evidence-unavailable: "X-GitHub-Delivery was not observed, but the request header capture is incomplete, so its absence cannot be proven."
