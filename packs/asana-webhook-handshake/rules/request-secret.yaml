schemaVersion: 1
id: WL-ASANA-HANDSHAKE-SECRET-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Asana webhook handshake request must contain exactly one X-Hook-Secret
explanation: Asana's webhook creation handshake sends a generated X-Hook-Secret that the target must echo back.
docsRef: create-webhook
remediationKey: asana-webhook-handshake-request-secret
requires: >-
  envelope.request.headersCompleteness == "complete" ||
  envelope.request.headers.exists(h, h.name.lowerAscii() == "x-hook-secret")
assert: >-
  envelope.request.headers.filter(h, h.name.lowerAscii() == "x-hook-secret").size() == 1 &&
  envelope.request.headers.exists(h, h.name.lowerAscii() == "x-hook-secret" && h.value != "")
evidencePointers:
  - /request/headers
messages:
  evidence-unavailable: "X-Hook-Secret was not observed, but the request header capture is incomplete."
