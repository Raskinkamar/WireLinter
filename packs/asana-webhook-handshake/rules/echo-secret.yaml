schemaVersion: 1
id: WL-ASANA-HANDSHAKE-ECHO-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Asana webhook handshake must echo X-Hook-Secret exactly once
explanation: The handshake response must include X-Hook-Secret with the exact value Asana supplied in the request.
docsRef: create-webhook
remediationKey: asana-webhook-handshake-echo-secret
requires: >-
  has(envelope.response) &&
  (envelope.request.headersCompleteness == "complete" ||
   envelope.request.headers.exists(h, h.name.lowerAscii() == "x-hook-secret")) &&
  (envelope.response.headersCompleteness == "complete" ||
   envelope.response.headers.exists(h, h.name.lowerAscii() == "x-hook-secret"))
assert: >-
  envelope.request.headers.filter(h, h.name.lowerAscii() == "x-hook-secret").size() == 1 &&
  envelope.response.headers.filter(h, h.name.lowerAscii() == "x-hook-secret").size() == 1 &&
  envelope.request.headers.exists(
    requestHeader,
    requestHeader.name.lowerAscii() == "x-hook-secret" &&
    envelope.response.headers.exists(
      responseHeader,
      responseHeader.name.lowerAscii() == "x-hook-secret" &&
      responseHeader.value == requestHeader.value
    )
  )
evidencePointers:
  - /request/headers
  - /response/headers
messages:
  evidence-unavailable: "The request or response header capture is incomplete, so the X-Hook-Secret echo cannot be decided safely."
