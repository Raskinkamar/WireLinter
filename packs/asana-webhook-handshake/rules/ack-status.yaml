schemaVersion: 1
id: WL-ASANA-HANDSHAKE-ACK-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Asana webhook handshake must return HTTP 200 or 204
explanation: Asana accepts HTTP 200 OK or 204 No Content for the webhook creation handshake response.
docsRef: create-webhook
remediationKey: asana-webhook-handshake-status
requires: has(envelope.response)
assert: envelope.response.status == 200 || envelope.response.status == 204
evidencePointers:
  - /response/status
messages:
  evidence-unavailable: "No response was captured, so the Asana webhook handshake status cannot be decided."
