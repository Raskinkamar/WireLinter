schemaVersion: 1
id: timestamp-body-hmac-sha256
sourceRefs:
  - webhooks
secret:
  ref: webhook-secret
  representation: utf8
parsers:
  signature-fields:
    sourceHeader:
      name: x-knock-signature
      cardinality: exactly-one
      trimSpace: true
    format:
      type: delimited-pairs
      itemDelimiter: ","
      pairDelimiter: "="
      trimSpace: true
bindings:
  timestamp:
    fromField:
      parser: signature-fields
      key: t
      cardinality: exactly-one
  signature-candidates:
    fromField:
      parser: signature-fields
      key: s
      cardinality: exactly-one
  body:
    fromRawBody:
      requireFidelity: exact
message:
  - binding: timestamp
    suffix: "."
  - binding: body
candidates:
  binding: signature-candidates
  encoding: base64-standard
mac:
  algorithm: hmac-sha256
