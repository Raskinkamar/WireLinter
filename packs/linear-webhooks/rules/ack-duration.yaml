schemaVersion: 1
id: WL-LINEAR-ACK-DURATION-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Linear webhook acknowledgement must complete within five seconds
explanation: Linear treats a delivery that takes longer than five seconds to respond as failed and retries it.
docsRef: webhooks
remediationKey: linear-ack-duration
requires: has(envelope.response)
assert: double(envelope.response.durationMs) <= 5000.0
evidencePointers:
  - /response/durationMs
messages:
  evidence-unavailable: "No application response timing was captured, so WireLinter cannot decide whether the handler met Linear's five-second deadline."
