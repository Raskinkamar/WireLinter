schemaVersion: 1
id: WL-LINEAR-EVENT-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Linear event type header must be present
explanation: Linear sends Linear-Event with the entity type that triggered the webhook.
docsRef: webhooks
remediationKey: linear-event-header
requires: >-
  envelope.request.headersCompleteness == "complete" ||
  envelope.request.headers.exists(h, h.name.lowerAscii() == "linear-event" && h.value != "")
assert: >-
  envelope.request.headers.exists(h, h.name.lowerAscii() == "linear-event" && h.value != "")
evidencePointers:
  - /request/headers
messages:
  evidence-unavailable: "Linear-Event was not observed, but the request header capture is incomplete, so its absence cannot be proven."
