schemaVersion: 1
id: WL-KLAVIYO-ACK-DURATION-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Klaviyo system webhook acknowledgement must complete within 5 seconds
explanation: Klaviyo considers the system webhook request failed if the endpoint does not return an accepted status within five seconds.
docsRef: system-webhooks
remediationKey: klaviyo-system-webhook-ack-duration
requires: has(envelope.response)
assert: double(envelope.response.durationMs) < 5000.0
evidencePointers:
  - /response/durationMs
messages:
  evidence-unavailable: "No response timing was captured, so Klaviyo's five-second deadline cannot be decided."
