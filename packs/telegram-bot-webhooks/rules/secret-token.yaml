schemaVersion: 1
id: WL-TELEGRAM-SECRET-001
kind: secret-match
scope: envelope
severity: error
stability: preview
title: Telegram webhook secret token must match
explanation: When secret_token is configured with setWebhook, Telegram includes the exact value in X-Telegram-Bot-Api-Secret-Token on every webhook request.
secretMatchRef: webhook-secret-token
docsRef: bot-api
remediationKey: telegram-webhook-secret-token
messages:
  secret-match-valid: "X-Telegram-Bot-Api-Secret-Token matches the configured webhook secret token."
  secret-unavailable: "Set TELEGRAM_WEBHOOK_SECRET_TOKEN to verify the Telegram secret header."
  missing-secret-input: "X-Telegram-Bot-Api-Secret-Token is missing from a complete capture of secret-token mode."
  ambiguous-secret-input: "Multiple Telegram secret-token header values were observed where exactly one is expected."
  secret-mismatch: "X-Telegram-Bot-Api-Secret-Token does not match the configured Telegram webhook secret token."
  insufficient-header-evidence: "The header capture is incomplete, so absence of X-Telegram-Bot-Api-Secret-Token cannot be proven."
