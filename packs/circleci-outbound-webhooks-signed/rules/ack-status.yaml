schemaVersion: 1
id: WL-CIRCLECI-ACK-STATUS-001
kind: cel
scope: envelope
severity: error
stability: preview
title: CircleCI outbound webhook acknowledgement must be 2xx
explanation: CircleCI expects a 2xx response and retries non-2xx deliveries.
docsRef: outbound
remediationKey: circleci-outbound-ack-status
requires: has(envelope.response)
assert: envelope.response.status >= 200 && envelope.response.status < 300
evidencePointers:
  - /response/status
messages:
  evidence-unavailable: "No response was captured, so the CircleCI acknowledgement status cannot be decided."
