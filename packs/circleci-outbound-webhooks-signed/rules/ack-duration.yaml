schemaVersion: 1
id: WL-CIRCLECI-ACK-DURATION-001
kind: cel
scope: envelope
severity: error
stability: preview
title: CircleCI outbound webhook acknowledgement must complete within 10 seconds
explanation: CircleCI currently treats a webhook delivery as failed if no response arrives within 10 seconds.
docsRef: outbound
remediationKey: circleci-outbound-ack-duration
requires: has(envelope.response)
assert: double(envelope.response.durationMs) < 10000.0
evidencePointers:
  - /response/durationMs
messages:
  evidence-unavailable: "No response timing was captured, so the CircleCI 10-second deadline cannot be decided."
