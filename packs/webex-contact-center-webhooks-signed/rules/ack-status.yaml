schemaVersion: 1
id: WL-WEBEX-CC-ACK-STATUS-001
kind: cel
scope: envelope
severity: error
stability: preview
title: Webex Contact Center acknowledgement must be 2xx
explanation: Webex Contact Center accepts any 2xx response; any other response is considered a failure and redirects are not followed.
docsRef: using-webhooks
remediationKey: webex-contact-center-webhook-ack-status
requires: has(envelope.response)
assert: envelope.response.status >= 200 && envelope.response.status < 300
evidencePointers:
  - /response/status
messages:
  evidence-unavailable: "No response was captured, so Webex Contact Center acknowledgement status cannot be decided."
