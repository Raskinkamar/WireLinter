packProtocol: "1.2"
id: lemonsqueezy-webhooks
name: Lemon Squeezy Webhooks
packVersion: 0.1.0
providerDocsRevision: "2026-08-17"
minWireLinterVersion: 0.1.0
capabilities:
  - passive-lint
secrets:
  signing-secret:
    env: LEMONSQUEEZY_WEBHOOK_SECRET
    required: false
    description: Signing secret configured for the Lemon Squeezy webhook
docs:
  signing:
    url: https://docs.lemonsqueezy.com/help/webhooks/signing-requests
    revision: "2026-08-17"
    section: Signing Requests
  requests:
    url: https://docs.lemonsqueezy.com/help/webhooks/webhook-requests
    revision: "2026-08-17"
    section: Webhook Requests
  overview:
    url: https://docs.lemonsqueezy.com/help/webhooks
    revision: "2026-08-17"
    section: Creating webhooks
signatures:
  payload-hmac-sha256: signatures/payload-hmac-sha256.yaml
rules:
  - rules/signature.yaml
  - rules/method.yaml
  - rules/event-header.yaml
metadata:
  status: preview
  maintainer: wirelint
  surface: signed-webhook
