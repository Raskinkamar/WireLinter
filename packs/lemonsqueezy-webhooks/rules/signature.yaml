schemaVersion: 1
id: WL-LEMON-SIGNATURE-001
kind: signature
scope: envelope
severity: error
stability: preview
title: Lemon Squeezy webhook signature must be valid
explanation: Lemon Squeezy signs the exact webhook payload with HMAC-SHA256 using the configured signing secret and sends the hex digest in X-Signature.
signatureRef: payload-hmac-sha256
docsRef: signing
remediationKey: lemonsqueezy-webhook-signature
messages:
  missing-signature: "X-Signature is missing from a complete Lemon Squeezy webhook capture."
  malformed-signature: "Lemon Squeezy X-Signature is malformed; signatures are hex HMAC-SHA256 digests."
  signature-mismatch: "X-Signature does not match HMAC-SHA256 of the exact raw payload for the supplied signing secret."
  secret-unavailable: "Set LEMONSQUEEZY_WEBHOOK_SECRET to verify authenticity."
  insufficient-body-fidelity: "Lemon Squeezy signs the raw request payload, so reconstructed or unavailable body bytes cannot prove authenticity."
  insufficient-header-evidence: "The header capture is incomplete, so X-Signature cannot be proven absent."
